[tools]
python = "3.12"

[env]
# ART_SDK_ROOT = "{{ config_root }}/examples"

[tasks."setup"]
description = "Install dependencies and setup environment"
run = "uv sync"

[tasks."scan"]
description = "Scan for SMARTWIZ+ art devices"
run = "uv run examples/scan_art_device.py"

[tasks."connect"]
description = "Connect the device to Wi-Fi using dynamic device name"
run = """
DEVICE_NAME=$(mise run scan | jq -r '.devices[0].local_name')
if [ "$DEVICE_NAME" = "null" ] || [ -z "$DEVICE_NAME" ]; then
  echo "Error: No device found."
  exit 1
fi
echo "Connecting to $DEVICE_NAME..."
uv run examples/connect_wifi.py "$DEVICE_NAME" "$WIFI_SSID" "$WIFI_PASS"
"""

[tasks."upload"]
description = "Convert and upload an image (JPG/PNG/GIF) to the device"
usage = "upload <image_file> [--crop]"
run = """
# Use the argument defined in usage
INPUT_IMAGE="{{ image_file }}"
TEMP_S6="output_temp.s6"

# Check for --crop flag
CONVERT_ARGS=""
if [ "{{ crop }}" = "true" ]; then
  CONVERT_ARGS="--crop"
  echo "Crop mode enabled (filling screen)..."
else
  echo "Letterbox mode enabled (adding margins)..."
fi

# Target resolution: if ART_IP is set, use it. Otherwise, try to resolve via scan.
TARGET="${ART_IP}"
if [ -z "$TARGET" ]; then
  echo "ART_IP not set. Scanning for device..."
  DEVICE_NAME=$(mise run scan | jq -r '.devices[0].local_name')
  if [ "$DEVICE_NAME" = "null" ] || [ -z "$DEVICE_NAME" ]; then
    echo "Error: Device not found and ART_IP is not set."
    exit 1
  fi
  TARGET="$DEVICE_NAME"
fi

echo "Converting $INPUT_IMAGE to $TEMP_S6..."
uv run examples/convert_image.py $CONVERT_ARGS "$INPUT_IMAGE" "$TEMP_S6"

echo "Uploading to $TARGET..."
uv run examples/display_local_image.py "$TARGET" "$TEMP_S6"

rm -f "$TEMP_S6"
"""

rm -f "$TEMP_S6"
"""
